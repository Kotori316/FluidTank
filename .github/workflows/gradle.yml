name: Java CI

on:
  push:
    branches:
      - "1.19.2-fabric"
    paths:
      - "src/main/scala/**"
      - "src/test/**"
      - "gradle.properties"
      - ".github/workflows/gradle.yml"
  pull_request:
    branches:
      - "1.19.2-fabric"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17 ]

    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      #- uses: actions/cache@v2
      #  with:
      #    path: ~/.gradle/caches
      #    key: ${{ runner.os }}-gradle-${{ hashFiles('**/forge_version.properties') }}
      - name: Permission
        run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
          add-job-summary: 'on-failure'
      - name: Check Parameter
        run: ./gradlew gCO
      - name: Toolchain
        run: ./gradlew javaToolchains
      - name: Check Dependencies
        run: ./gradlew dependencies
      - name: Precompile
        run: ./gradlew classes
      - name: Data Generation
        run: ./gradlew runData
      - name: Assemble
        run: ./gradlew assemble
      - name: Check artifacts
        run: ls -alF build/libs
      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          path: build/libs/*
          name: ${{ github.event.repository.name }}-${{ github.run_number }}
      - name: Prepare Test dir
        run: mkdir -p build/test-results/test
      - name: Test with Gradle
        if: ${{ contains(github.event.head_commit.message, '[skip release]')}}
        run: ./gradlew build
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_GAME_TEST: true
      - name: Build and Publish with Gradle
        if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
        run: ./gradlew build curseforge publishAllPublicationsToAzureRepositoryRepository
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_USER_NAME: 'Kotori316'
          AZURE_TOKEN: ${{ secrets.AZURE_TOKEN }}
          RUN_GAME_TEST: true
      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: build/test-results/test/*.xml
          name: Test-Report-${{ matrix.java }}-${{ github.run_number }}
